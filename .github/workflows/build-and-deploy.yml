name: Build and Deploy

on:
  pull_request:
    branches: [main]

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  # ------------------------------------------------------------------
  # Job 1: Lint and type-check
  # ------------------------------------------------------------------
  quality-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint

  # ------------------------------------------------------------------
  # Job 2: Build Android APK via EAS
  # ------------------------------------------------------------------
  build-android:
    name: Build Android (APK)
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive --no-wait

  # ------------------------------------------------------------------
  # Job 3: Build iOS via EAS
  # ------------------------------------------------------------------
  build-ios:
    name: Build iOS
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Build iOS
        run: eas build --platform ios --profile production --non-interactive --no-wait

  # ------------------------------------------------------------------
  # Job 4: Submit to Apple TestFlight
  # ------------------------------------------------------------------
  submit-testflight:
    name: Submit to TestFlight
    needs: build-ios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Submit to TestFlight
        run: eas submit --platform ios --profile production --non-interactive --latest

  # ------------------------------------------------------------------
  # Job 5: Submit to Google Play (internal testing track)
  # ------------------------------------------------------------------
  submit-google-play:
    name: Submit to Google Play (Internal)
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Submit to Google Play Store
        run: eas submit --platform android --profile production --non-interactive --latest

  # ------------------------------------------------------------------
  # Job 6: Upload to QA.tech for testing (placeholder)
  # ------------------------------------------------------------------
  upload-qatech:
    name: Upload to QA.tech
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload to QA.tech for testing
        env:
          QATECH_API_TOKEN: ${{ secrets.QATECH_API_TOKEN }}
        run: |
          echo "=== QA.tech Upload Placeholder ==="
          echo "This step will upload the built APK/IPA to QA.tech for automated testing."
          echo "TODO: Integrate QA.tech upload API when details are provided."
          echo ""
          echo "Expected integration:"
          echo "  - Download built artifacts from EAS"
          echo "  - Upload to QA.tech API endpoint"
          echo "  - Trigger automated test runs"
